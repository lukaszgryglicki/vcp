[package]
name = "vcp"
version = "0.1.0"
edition = "2021"
description = "FreeBSD cp(1)-compatible file copy program with ASCII progress bars"
license = "BSD-2-Clause"
repository = "https://github.com/lukaszgryglicki/vcp"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
